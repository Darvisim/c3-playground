<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C3 Playground</title>
	<meta name="description" content="In-browser C3 compiler and interactive playground. Compiles and executes C3 entirely in WebAssembly with zero backend dependencies.">
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
	<meta name="theme-color" content="#1e2029">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://play.c3-lang.com/">
	<meta property="og:title" content="C3 Playground - In-Browser Compiler">
	<meta property="og:description" content="Interactive C3 compiler and runtime executing 100% client-side via WebAssembly.">
	<meta property="og:image" content="https://play.c3-lang.com/preview.png">

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:site" content="@c3lang">
	<meta name="twitter:title" content="C3 Playground - In-Browser Compiler">
	<meta name="twitter:description" content="Interactive C3 compiler and runtime executing 100% client-side via WebAssembly.">
	<meta name="twitter:image" content="https://play.c3-lang.com/preview.png">
	<style>
		:root {
			--bg-dark: #1e2029;
			--panel-bg: #1e2029;
			--editor-bg: #272935;
			--border: #323544;
			--accent: #38bdf8;
			--accent-hover: #0284c7;
			--btn-primary: #2563eb;
			--btn-primary-hover: #1d4ed8;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--console-bg: #16181e;
			--title-bg: #302e3d;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: var(--bg-dark);
			color: var(--text-main);
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			background-color: var(--panel-bg);
			border-bottom: 1px solid var(--border);
			padding: 10px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.header-left {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.brand-link {
			display: flex;
			align-items: center;
			gap: 8px;
			text-decoration: none;
			color: inherit;
		}

		.brand-link img {
			height: 38px;
			width: auto;
			display: block;
		}

		.brand-title {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--accent);
		}

		.nav-links {
			display: inline-flex;
			align-items: center;
			gap: 12px;
			margin-left: 6px;
		}

		.docs-link {
			font-size: 0.85rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: normal;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			transition: color 0.2s ease;
			background: none;
			border: none;
			padding: 0;
			cursor: pointer;
			font-family: inherit;
		}

		.docs-link:hover {
			color: var(--accent);
		}

		.controls {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		select,
		button {
			font-size: 0.9rem;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg-dark);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:focus,
		button:focus {
			outline: none;
			border-color: var(--accent);
		}

		button.primary {
			background-color: var(--btn-primary);
			color: #fff;
			font-weight: 600;
			border: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			line-height: 1;
		}

		button.primary:hover:not(:disabled) {
			background-color: var(--btn-primary-hover);
			color: #fff;
		}

		#compileBtnText {
			display: inline-flex;
			align-items: center;
			line-height: 1;
			transform: translateY(-1px);
		}

		#shortcutHint {
			font-family: inherit;
			font-size: 0.72rem;
			font-weight: 500;
			background: rgba(0, 0, 0, 0.3);
			padding: 2px 6px;
			border-radius: 4px;
			color: rgba(255, 255, 255, 0.85);
			line-height: 1.2;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.compile-btn-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.compile-tooltip {
			opacity: 0;
			visibility: hidden;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background-color: #0b1329;
			border: 1px solid var(--border);
			color: #e2e8f0;
			padding: 12px;
			border-radius: 6px;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.75rem;
			line-height: 1.5;
			white-space: pre;
			z-index: 1000;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.6);
			pointer-events: none;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.compile-btn-container:hover #compileBtn:not(:disabled) ~ .compile-tooltip {
			opacity: 1;
			visibility: visible;
		}

		.settings-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.settings-btn {
			padding: 8px;
			background: var(--bg-dark);
			border: 1px solid var(--border);
			border-radius: 6px;
			color: var(--text-main);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.settings-btn:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.settings-popover {
			display: none;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			width: 320px;
			background: #0b1329;
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 16px;
			z-index: 1000;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
			flex-direction: column;
			gap: 8px;
		}

		.settings-popover.active {
			display: flex;
		}

		.popover-header {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--accent);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 2px;
		}

		.settings-popover label {
			font-size: 0.8rem;
			color: var(--text-muted);
		}

		.settings-popover input {
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.85rem;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--panel-bg);
			color: var(--text-main);
			width: 100%;
		}

		.settings-popover input:focus {
			outline: none;
			border-color: var(--accent);
		}

		.popover-help {
			font-size: 0.75rem;
			color: var(--text-muted);
			line-height: 1.4;
		}

		main {
			flex: 1;
			display: grid;
			grid-template-columns: 1fr 10px 1fr;
			padding: 12px;
			overflow: hidden;
			box-sizing: border-box;
		}

		.pane {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.resizer {
			width: 10px;
			cursor: col-resize;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			user-select: none;
		}

		.resizer::after {
			content: "";
			width: 2px;
			height: 40px;
			background-color: var(--border);
			border-radius: 1px;
			transition: background-color 0.2s ease, height 0.2s ease, width 0.2s ease;
		}

		.resizer:hover::after,
		.resizer.dragging::after {
			background-color: var(--accent);
			height: 100%;
		}

		.pane-header {
			background: var(--title-bg);
			padding: 8px 16px;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.editor-actions {
			display: flex;
			gap: 8px;
		}

		.icon-btn {
			background: transparent;
			border: none;
			color: var(--text-muted);
			padding: 4px;
			cursor: pointer;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
		}

		.icon-btn:hover {
			color: var(--accent);
			background: rgba(56, 189, 248, 0.1);
		}

		.icon-btn svg {
			width: 16px;
			height: 16px;
		}

		#code {
			flex: 1;
			width: 100%;
			min-height: 0;
			background: var(--editor-bg);
		}

		pre {
			flex: 1;
			background: var(--console-bg);
			color: #38bdf8;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 13px;
			line-height: 1.5;
			padding: 16px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-all;
			-webkit-overflow-scrolling: touch;
		}

		#canvasContainer {
			position: relative;
			display: none;
			background: var(--console-bg);
			border-bottom: 1px solid var(--border);
			resize: vertical;
			overflow: hidden;
			height: 481px;
			min-height: 80px;
			max-height: 95%;
		}

		#canvasContainer:fullscreen {
			border: none;
			max-height: none;
			background: #000;
			padding: 0;
		}

		#canvasContainer:fullscreen .canvas-wrapper {
			padding: 0;
		}

		.canvas-wrapper {
			display: flex;
			width: 100%;
			height: 100%;
			padding: 6px;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
			overflow: hidden;
		}

		#canvas {
			background: #000;
			border: 1px solid var(--border);
			image-rendering: auto;
			display: block;
			box-sizing: border-box;
			outline: none;
			user-select: none;
			-webkit-user-select: none;
		}

		.canvas-fullscreen-btn {
			position: absolute;
			top: 12px;
			right: 12px;
			background: rgba(15, 23, 42, 0.85);
			border: 1px solid var(--border);
			color: var(--text-main);
			border-radius: 6px;
			padding: 6px;
			cursor: pointer;
			opacity: 0;
			transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		#canvasContainer:hover .canvas-fullscreen-btn {
			opacity: 1;
		}

		@media (hover: none),
		(pointer: coarse) {
			.canvas-fullscreen-btn {
				opacity: 1;
				background: rgba(15, 23, 42, 0.75);
			}
		}

		.canvas-fullscreen-btn:hover {
			background: var(--accent);
			color: #0f172a;
		}

		@media (max-width: 768px) {
			#canvasContainer {
				height: 140px;
			}
		}

		.console-link:hover {
			text-decoration: underline !important;
			color: #0284c7 !important;
		}

		@media (max-width: 768px) {
			#shortcutHint {
				display: none !important;
			}

			main {
				grid-template-columns: 1fr !important;
				grid-template-rows: 1fr 10px 1fr;
			}

			.resizer {
				width: 100%;
				height: 10px;
				cursor: row-resize;
			}

			.resizer::after {
				width: 40px;
				height: 2px;
			}

			.resizer:hover::after,
			.resizer.dragging::after {
				width: 100%;
				height: 2.2px;
			}
		}

		@media (max-width: 480px) {
			header {
				padding: 12px;
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}

			.controls {
				width: 100%;
				justify-content: space-between;
			}

			select {
				flex: 1;
				max-width: 150px;
			}
		}

		/* Stdlib Docs Modal */
		#stdlibDocsModal {
			position: fixed;
			inset: 0;
			z-index: 9000;
			background: rgba(0, 0, 0, 0.72);
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.18s ease;
		}
		#stdlibDocsModal.open {
			opacity: 1;
			pointer-events: all;
		}
		#stdlibDocsPanel {
			position: relative;
			width: 92vw;
			height: 90vh;
			background: #1e2029;
			border: 1px solid #323542;
			border-radius: 10px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			box-shadow: 0 24px 64px rgba(0,0,0,0.6);
			transform: scale(0.97);
			transition: transform 0.18s ease;
		}
		#stdlibDocsModal.open #stdlibDocsPanel {
			transform: scale(1);
		}
		#stdlibDocsClose {
			position: absolute;
			top: 10px;
			right: 12px;
			z-index: 10;
			background: rgba(255,255,255,0.08);
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 6px;
			color: #e2e8f0;
			padding: 5px 8px;
			cursor: pointer;
			display: flex;
			align-items: center;
			transition: background 0.15s;
		}
		#stdlibDocsClose:hover { background: rgba(255,255,255,0.16); }
		#stdlibDocsIframe {
			flex: 1;
			width: 100%;
			border: none;
			background: #1e2029;
		}
	</style>

</head>

<body>

	<header>
		<div class="header-left">
			<a href="https://c3-lang.org/" class="brand-link" title="C3 Programming Language (c3-lang.org)">
				<img src="favicon.svg" alt="C3 Logo">
			</a>
			<span class="brand-title">Playground</span>
			<nav class="nav-links">
				<button id="docsBtn" class="docs-link" title="Open C3 Standard Library Documentation">
					<span>Stdlib</span>
				</button>
				<a href="https://c3-lang.org/getting-started/hello-world/" target="_blank" rel="noopener noreferrer" class="docs-link" title="C3 Documentation">
					<span>Documentation</span>
				</a>
				<a href="https://github.com/c3lang/c3c" target="_blank" rel="noopener noreferrer" class="docs-link" title="GitHub Repository (c3lang/c3c)" aria-label="GitHub Repository">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
						<path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
					</svg>
				</a>
			</nav>
		</div>
		<div class="controls">
			<select id="exampleSelect">
				<option value="" disabled selected hidden>Examples...</option>
			</select>

			<div class="settings-container">
				<button id="settingsBtn" class="settings-btn" title="Compiler Settings" aria-label="Compiler Settings">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="3"></circle>
						<path
							d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
						</path>
					</svg>
				</button>
				<div id="settingsPopover" class="settings-popover">
					<div class="popover-header">Compiler Flags</div>
					<label for="extraFlagsInput">Extra Arguments:</label>
					<input type="text" id="extraFlagsInput" placeholder="-O3 --safe=yes -D FOO" spellcheck="false"
						autocomplete="off">
					<span class="popover-help">Additional flags passed directly to <code>c3c compile</code>.</span>
				</div>
			</div>

			<div class="compile-btn-container">
				<button id="compileBtn" class="primary" disabled>
					<span id="compileBtnText">Loading...</span>
					<kbd id="shortcutHint" style="display:none">Ctrl+↵</kbd>
				</button>
				<pre id="statusTooltip" class="compile-tooltip">Fetching version...</pre>
			</div>
		</div>
	</header>

	<main id="mainLayout">
		<div class="pane">
			<div class="pane-header">
				<span>SOURCE CODE (C3)</span>
				<div class="editor-actions">
					<button id="shareBtn" title="Share Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<circle cx="18" cy="5" r="3"></circle>
							<circle cx="6" cy="12" r="3"></circle>
							<circle cx="18" cy="19" r="3"></circle>
							<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
							<line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
						</svg>
					</button>
					<button id="copyBtn" title="Copy Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
							<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
					</button>
					<button id="saveBtn" title="Save File (Ctrl+S)" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
							<polyline points="17 21 17 13 7 13 7 21"></polyline>
							<polyline points="7 3 7 8 15 8"></polyline>
						</svg>
					</button>
				</div>
			</div>
			<div id="code"></div>
		</div>

		<div class="resizer" id="resizer"></div>

		<div class="pane">
			<div class="pane-header">
				<span>CONSOLE OUTPUT</span>
				<button id="clearBtn" title="Clear console and stop execution" class="icon-btn"
					aria-label="Clear console and stop execution">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
						stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
